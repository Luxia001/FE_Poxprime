<article
  class="flex h-full min-h-72 flex-col rounded-2xl border border-slate-200 p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
  [class.bg-emerald-50]="statusTone() === 'success'"
  [class.text-emerald-700]="statusTone() === 'success'"
  [class.bg-amber-50]="statusTone() === 'warning'"
  [class.text-amber-700]="statusTone() === 'warning'"
  [class.bg-red-50]="statusTone() === 'danger'"
  [class.text-red-700]="statusTone() === 'danger'"
  [class.bg-slate-100]="statusTone() === 'neutral'"
  [class.text-slate-600]="statusTone() === 'neutral'"
>
  <div class="flex-1 items-start justify-between gap-3">
    <span
      class="flex size-11 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-xl font-bold text-blue-700"
      aria-hidden="true"
    >
      <nz-icon [nzType]="iconType()" nzTheme="outline" />
    </span>
    @if (status()) {
      <span
        class="rounded-full px-2.5 py-1 text-xs font-semibold"
        [class.bg-emerald-50]="statusTone() === 'success'"
        [class.text-emerald-700]="statusTone() === 'success'"
        [class.bg-amber-50]="statusTone() === 'warning'"
        [class.text-amber-700]="statusTone() === 'warning'"
        [class.bg-red-50]="statusTone() === 'danger'"
        [class.text-red-700]="statusTone() === 'danger'"
        [class.bg-slate-100]="statusTone() === 'neutral'"
        [class.text-slate-600]="statusTone() === 'neutral'"
        >{{ status() }}</span
      >
    }
  </div>
  <h3 class="mb-0 mt-4 text-base font-bold text-slate-900">{{ title() }}</h3>
  <p class="mb-0 mt-2 text-sm leading-6 text-slate-500">{{ description() }}</p>
  @if (details().length) {
    <dl class="mt-4 grid gap-2 border-t border-slate-100 pt-4">
      @for (detail of details(); track detail.label) {
        <div class="flex items-start justify-between gap-3 text-xs">
          <dt class="text-slate-500">{{ detail.label }}</dt>
          <dd class="m-0 text-right font-medium text-slate-700">{{ detail.value }}</dd>
        </div>
      }
    </dl>
  }
  @if (actionLabel()) {
    <button
      type="button"
      (click)="action.emit()"
      class="mt-auto w-full rounded-lg border border-blue-700 bg-white px-4 py-2 text-sm font-semibold text-blue-700 transition hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
    >
      {{ actionLabel() }}
    </button>
  }
</article>

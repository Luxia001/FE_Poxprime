@if (open()) {
  <div
    class="fixed inset-0 z-100 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-sm"
    role="presentation"
    (click)="type() !== 'loading' && closed.emit()"
  >
    <section
      class="w-full max-w-sm rounded-2xl bg-white p-6 text-center shadow-2xl"
      role="dialog"
      aria-modal="true"
      aria-labelledby="status-modal-title"
      aria-describedby="status-modal-message"
      (click)="$event.stopPropagation()"
    >
      <div
        class="mx-auto mb-4 flex size-14 items-center justify-center rounded-full"
        [class.bg-blue-50]="type() === 'loading'"
        [class.bg-emerald-50]="type() === 'success'"
        [class.bg-red-50]="type() === 'error'"
      >
        @switch (type()) {
          @case ('loading') {
            <span
              class="size-7 animate-spin rounded-full border-3 border-blue-600 border-t-transparent"
              aria-hidden="true"
            ></span>
          }
          @case ('success') {
            <span class="text-3xl font-bold text-emerald-600" aria-hidden="true">✓</span>
          }
          @case ('error') {
            <span class="text-3xl font-bold text-red-600" aria-hidden="true">!</span>
          }
        }
      </div>
      <h2 id="status-modal-title" class="m-0 text-xl font-bold text-slate-900">{{ title() }}</h2>
      <p id="status-modal-message" class="mt-2 text-sm leading-6 text-slate-600">{{ message() }}</p>
      @if (details().length) {
        <ul class="mt-3 rounded-lg bg-red-50 p-3 text-left text-sm text-red-700">
          @for (detail of details(); track detail) {
            <li>• {{ detail }}</li>
          }
        </ul>
      }
      @if (type() !== 'loading') {
        <button
          type="button"
          (click)="confirmed.emit()"
          class="mt-6 h-11 w-full cursor-pointer rounded-lg border-0 bg-blue-700 font-medium text-white! hover:bg-blue-800"
        >
          {{ actionLabel() || (type() === 'success' ? 'Continue' : 'Try again') }}
        </button>
      }
    </section>
  </div>
}

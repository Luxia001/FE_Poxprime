@if (open()) {
  <div class="fixed inset-0 z-100 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-sm" role="presentation">
    <section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="shared-otp-title">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 id="shared-otp-title" class="m-0 text-xl font-bold text-slate-900">{{ title() }}</h2>
          <p class="mb-0 mt-2 text-sm text-slate-500">{{ message() }}</p>
        </div>
        <button type="button" [disabled]="submitting()" (click)="closed.emit()" class="flex size-9 items-center justify-center rounded-lg border-0 bg-slate-100 text-xl text-slate-600 disabled:opacity-50" aria-label="Close">×</button>
      </div>

      <div class="mt-6"><app-code-otp [control]="control()" /></div>
      @if (error()) { <p class="mt-4 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert">{{ error() }}</p> }
      @if (showRememberDevice()) {
        <label class="mt-4 flex cursor-pointer items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" class="size-4 accent-blue-700" [checked]="rememberDevice()" (change)="rememberDeviceChange.emit($any($event.target).checked)" />
          <span>Remember this device</span>
        </label>
      }

      <div class="mt-6 grid gap-3" [class.sm:grid-cols-2]="showResend()">
        @if (showResend()) {
          <button type="button" [disabled]="submitting()" (click)="resend.emit()" class="h-11 rounded-lg border border-blue-700 bg-white font-semibold text-blue-700 disabled:opacity-50">Resend OTP</button>
        }
        <button nz-button nzType="primary" type="button" [nzLoading]="submitting()" [disabled]="submitting()" (click)="confirmed.emit()" class="h-11! rounded-lg! bg-blue-700! text-white!">Verify</button>
      </div>
    </section>
  </div>
}

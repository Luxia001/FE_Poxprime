<div role="tablist" aria-label="Wallet filter" class="flex shrink-0 overflow-x-auto rounded-xl p-1">
  @for (t of tabs(); track t.key) {
    <button
      type="button"
      role="tab"
      class="flex items-center px-4 py-2 text-sm font-medium transition"
      [class]="
        active() === t.key
          ? 'bg-white text-(--primary-theme--)! border-b-2 border-(--primary-theme--)'
          : 'text-gray-500 hover:text-slate-800 border-b-2 border-gray-300'
      "
      [disabled]="t.disabled"
      (click)="select(t.key)"
    >
      {{ t.label }}
    </button>
  }
</div>

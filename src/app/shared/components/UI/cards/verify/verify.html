<article
  class="flex h-full min-h-60 flex-col justify-center items-center rounded-2xl border border-slate-200 p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
  [class.bg-emerald-50]="statusTone() === 'success'"
  [class.text-emerald-700]="statusTone() === 'success'"
  [class.bg-amber-50]="statusTone() === 'warning'"
  [class.text-amber-700]="statusTone() === 'warning'"
  [class.bg-red-50]="statusTone() === 'danger'"
  [class.text-red-700]="statusTone() === 'danger'"
  [class.bg-slate-100]="statusTone() === 'neutral'"
  [class.text-slate-600]="statusTone() === 'neutral'"
>
  <div class="flex items-center justify-center rounded-full text-5xl font-bold">
    <nz-icon [nzType]="iconType()" nzTheme="outline" />
  </div>

  <h3 class="mb-0 mt-4 text-base font-bold text-slate-900">{{ title() }}</h3>
  <p class="mb-0 mt-2 text-sm text-center leading-6 text-slate-500">{{ description() }}</p>
@if (mode() === 'badge') {
  <span class="rounded-full bg-white/70 px-2.5 py-1 text-center text-xs font-semibold">
    {{ status() }}
  </span>
} @else {
  <button type="button" (click)="action.emit()" class="underline">
    {{ status() }}
  </button>
}
</article>

<article class="flex lfl h-60 flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
  <header class="flex items-start justify-between gap-4">
    <div>
      <p class="m-0 text-sm font-medium text-slate-500">{{ title() }}</p>
      @if (value()) {
        <p class="mb-0 mt-1 text-2xl font-bold text-slate-900">{{ value() }}</p>
      }
    </div>
    @if (change()) {
      <span
        class="rounded-full px-2.5 py-1 text-xs font-semibold"
        [class.bg-emerald-50]="changePositive()"
        [class.text-emerald-700]="changePositive()"
        [class.bg-red-50]="!changePositive()"
        [class.text-red-700]="!changePositive()"
        >{{ change() }}</span
      >
    }
  </header>
  <div class="relative min-h-0 h-full flex-1"><canvas #chartCanvas></canvas></div>
</article>

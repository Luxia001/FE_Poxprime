<section class="w-full">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
    <a routerLink="/account/user" class="text-sm font-medium text-blue-700 hover:underline"
      >← Back</a
    >

    @if (otpRequested()) {
      <div
        class="mt-6 rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800"
        role="status"
      >
        OTP request initiated. The OTP verification form can be connected in the next step.
      </div>
    }
    <div class="mt-6">
      <h1 class="m-0 text-2xl font-bold text-slate-900">KYC verification</h1>
      <p class="mb-0 mt-2 text-sm text-slate-500">
        Confirm your profile information and select an identity document before phone verification.
      </p>
      <app-profile-edit
        [submitting]="modalOpen() && modalType() === 'loading'"
        [showSubmit]="false"
        (formSubmitted)="updateProfileForKyc($event)"
      />
      <app-image [(file)]="idFile" [(idType)]="idType" [submitted]="submitted()" />
      <button
        nz-button
        nzType="primary"
        type="button"
        [nzLoading]="modalOpen() && modalType() === 'loading'"
        (click)="submitForm()"
        class="mt-4 h-11! w-full rounded-lg! bg-blue-700! text-white!"
      >
        Continue verification
      </button>
    </div>
  </div>
</section>

<app-otp-modal
  [open]="otpModalOpen()"
  title="Verify OTP"
  message="Enter the 6-digit code sent to your phone."
  [control]="otp"
  [submitting]="otpSubmitting()"
  [error]="otpError()"
  [showResend]="true"
  (closed)="otpModalOpen.set(false)"
  (resend)="sendOtp()"
  (confirmed)="verifyOtp()"
/>

<app-status-modal
  [open]="modalOpen()"
  [type]="modalType()"
  [title]="modalTitle()"
  [message]="modalMessage()"
  [details]="modalDetails()"
  [actionLabel]="
    modalType() === 'success' ? (sendOtpOnConfirm() ? 'Send OTP' : 'Continue') : 'Try again'
  "
  (closed)="closeModal()"
  (confirmed)="modalAction()"
/>

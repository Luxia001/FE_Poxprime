<section class="mx-auto w-full max-w-4xl rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8">
  <a routerLink="/account/user" class="text-sm font-medium text-blue-700 hover:underline">← Back to profile</a>
  <div class="mt-5">
    <h1 class="m-0 text-2xl font-bold text-slate-900">Edit profile</h1>
    <p class="mb-0 mt-2 text-sm text-slate-500">Update your profile image, personal and contact information.</p>
  </div>

  <div class="mt-6 flex flex-wrap items-center gap-4 rounded-xl border border-slate-200 bg-slate-50 p-4">
    <div class="flex size-20 items-center justify-center overflow-hidden rounded-full bg-blue-700 text-xl font-bold text-white">
      @if (profileApi.profile()?.member?.m_image_url; as imageUrl) {
        <img [src]="imageUrl" alt="Profile" class="size-full object-cover" />
      } @else {
        {{ profileApi.initials() || 'U' }}
      }
    </div>
    <div>
      <input #profileImage type="file" class="hidden" accept="image/jpeg,image/png" (change)="changeProfileImage($event)" />
      <button type="button" class="rounded-lg border border-blue-700 bg-white px-4 py-2 text-sm font-semibold text-blue-700 disabled:opacity-50" [disabled]="uploadingImage()" (click)="profileImage.click()">
        {{ uploadingImage() ? 'Uploading...' : 'Change profile image' }}
      </button>
      <p class="mb-0 mt-1 text-xs text-slate-500">JPG or PNG, maximum 2 MB</p>
      @if (imageError()) { <p class="mb-0 mt-2 text-sm text-red-600" role="alert">{{ imageError() }}</p> }
    </div>
  </div>

  <app-profile-edit [submitting]="saving()" submitLabel="Save changes" (formSubmitted)="updateProfile($event)" />
</section>

<app-status-modal [open]="modalOpen()" [type]="modalType()" [title]="modalTitle()" [message]="modalMessage()" [details]="modalDetails()" [actionLabel]="modalType() === 'success' ? 'Back to profile' : 'Try again'" (closed)="closeModal()" (confirmed)="modalAction()" />
